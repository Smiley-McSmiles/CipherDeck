<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Back card gradient -->
    <linearGradient id="backCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5e5c64"/>
      <stop offset="100%" stop-color="#3d3846"/>
    </linearGradient>
    <!-- Middle card gradient -->
    <linearGradient id="midCardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ec27e"/>
      <stop offset="100%" stop-color="#26a269"/>
    </linearGradient>
    <!-- Front vault card gradient (Adwaita blue) -->
    <linearGradient id="frontCardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#62a0ea"/>
      <stop offset="45%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>
    <!-- Gold key/emblem gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9f06b"/>
      <stop offset="50%" stop-color="#f6d32d"/>
      <stop offset="100%" stop-color="#e5a50a"/>
    </linearGradient>
    <!-- Dark keyhole/shield inner -->
    <linearGradient id="shieldInnerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241f31"/>
      <stop offset="100%" stop-color="#13101a"/>
    </linearGradient>
  </defs>

  <!-- Subtle ground shadow -->
  <rect x="16" y="34" width="96" height="82" rx="14" fill="#000000" opacity="0.16"/>

  <!-- Back card (fanned left/top) -->
  <g transform="rotate(-6 64 74)">
    <rect x="20" y="18" width="84" height="62" rx="11" fill="#241f31"/>
    <rect x="20" y="15" width="84" height="62" rx="11" fill="url(#backCardGrad)"/>
    <rect x="20.5" y="15.5" width="83" height="61" rx="10.5" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
  </g>

  <!-- Middle card (fanned right/top) -->
  <g transform="rotate(5 64 74)">
    <rect x="24" y="24" width="84" height="62" rx="11" fill="#1b744b"/>
    <rect x="24" y="21" width="84" height="62" rx="11" fill="url(#midCardGrad)"/>
    <rect x="24.5" y="21.5" width="83" height="61" rx="10.5" fill="none" stroke="#ffffff" stroke-opacity="0.22"/>
  </g>

  <!-- Front card 3D bottom lip -->
  <rect x="16" y="40" width="96" height="74" rx="13" fill="#1a5fb4"/>
  <!-- Front card body -->
  <rect x="16" y="36" width="96" height="74" rx="13" fill="url(#frontCardGrad)"/>
  <!-- Top inner highlight (Libadwaita bevel) -->
  <rect x="16.5" y="36.5" width="95" height="73" rx="12.5" fill="none" stroke="#ffffff" stroke-opacity="0.28"/>

  <!-- Subtle cipher card accent lines on left -->
  <rect x="27" y="51" width="26" height="5" rx="2.5" fill="#ffffff" opacity="0.35"/>
  <rect x="27" y="61" width="18" height="4" rx="2" fill="#ffffff" opacity="0.22"/>
  <rect x="27" y="92" width="32" height="4" rx="2" fill="#ffffff" opacity="0.20"/>

  <!-- Shield / Lock Emblem on right-center -->
  <g transform="translate(56, 48)">
    <!-- Shield 3D shadow -->
    <path d="M24 3 L44 10 V25 C44 37.5 35.5 46.5 24 51 C12.5 46.5 4 37.5 4 25 V10 Z"
          transform="translate(0, 2)" fill="#133d7a" opacity="0.65"/>
    <!-- Shield outer body -->
    <path d="M24 3 L44 10 V25 C44 37.5 35.5 46.5 24 51 C12.5 46.5 4 37.5 4 25 V10 Z"
          fill="url(#shieldInnerGrad)"/>
    <path d="M24 4.5 L42.5 11 V25 C42.5 36.5 34.6 44.8 24 49.2 C13.4 44.8 5.5 36.5 5.5 25 V11 Z"
          fill="none" stroke="#ffffff" stroke-opacity="0.16"/>

    <!-- Gold Keyhole / Lock glyph inside shield -->
    <circle cx="24" cy="22" r="6.5" fill="url(#goldGrad)"/>
    <path d="M21 26 L27 26 L28.5 37.5 C28.6 38.3 28 39 27.2 39 H20.8 C20 39 19.4 38.3 19.5 37.5 Z"
          fill="url(#goldGrad)"/>
  </g>
</svg>
